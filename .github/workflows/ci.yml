name: Incident Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Backend, frontend and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_DB: incident_manager_test
      POSTGRES_USER: incident_ci
      POSTGRES_PASSWORD: ci_only_password
      COOKIE_SECURE: 'false'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: incident_manager_test
          POSTGRES_USER: incident_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U incident_ci -d incident_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

        #database
      - name: Prepare the test database and session settings
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -c 'import secrets; print("SESSION_SECRET=" + secrets.token_hex(32))' >> "$GITHUB_ENV"

        #backend testing
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      #  frontend testing
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow
        working-directory: frontend
        shell: bash
        run: |
          # Run both servers while Playwright uses the app.
          python -m uvicorn main:app --app-dir ../backend --host 127.0.0.1 --port 8000 &
          api_pid=$!
          ./node_modules/.bin/vite --host localhost &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT

          # Check FastAPI through the Vite proxy before opening the browser.
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --max-time 2 http://localhost:5173/api/health
          npm run test:e2e

      - name: Save Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
